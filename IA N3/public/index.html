<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="estrutura.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
     <div class="menu-lateral">
        <img class="img-logo" src="imagens/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">

        <button class="button-menu" onclick="visao()">Visão Geral</button>

        <button id="btn-ativo" class="button-menu" >Bob IA</button>

       <button class="button-menu" onclick="manual()">Manual de instalação</button>

        <button class="btn-login" onclick="sair()">Sair </button>

    </div>
    
    <div class="fundo_direita">
        <div class="box_grande">
            <div class="ia"><i>Bob ia</i></div>
            <div class="bob">
                <div class="agentebob"></div>
                <div id="resposta" class="bob, resposta" style="margin-top: 20px; margin-left: 100px; "></div>
            </div>
            
            <button class="button_enviar" onclick="gerarResposta()"></button>
           <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
            
          
        </div>

   </div>

    <script>

        function manual(){
         window.location.href = "http://localhost:3333/manul_instala%C3%A7%C3%A3o.html" ;

        }

         function visao(){
         window.location.href = "http://127.0.0.1:5500/Web-data-viz/public/dashboard/suporte/pagina_Suporte.html" ;

        }

        function sair(){
         window.location.href = "http://localhost:3333/index.html" ;

        }
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
