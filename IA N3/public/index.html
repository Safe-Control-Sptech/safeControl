<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="estrutura.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

     <div class="menu-lateral">
       
            <img class="img-logo" src="../../Web-data-viz/public/assets/logo/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">
       

        <div class="perfil">
            <h6 style="color: #13131a; font-weight: 700;">Olá, <span id="b_usuario">Suporte</span>!</h6>
        </div>

        <button id="btn-ativo" class="button-menu" >Bob IA</button>
       <a href="../../Web-data-viz/public/manul_instalação.html"> <button class="button-menu">Manual de instalação</button></a>
        <a href="../../Web-data-viz/public/index.html"><button class="btn-login" onclick="sair()">Sair </button></a>

    </div>
    <div class="fundo_direita">
        <div class="box_grande">
            <div class="ia"><i>Bob ia</i></div>
            <div class="bob">
                <div class="agentebob"></div>
                <div id="resposta" class="bob, resposta" style="margin-top: 20px; margin-left: 100px; "></div>
            </div>
            
            <button class="button_enviar" onclick="gerarResposta()"></button>
           <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
            
          
        </div>

   </div>

    <script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
