<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo/Simbolo_SafeControl.png" type="image/x-icon">
    <title>SafeControl | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="ativarButtons()">
    <!-- Menu fixo de navegação -->

    <div class="menu-lateral">

        <a href="./dashboard.html">
            <img class="img-logo" src="../assets/logo/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">
        </a>

        <div class="perfil">
            <h6 style="color: #13131a; font-weight: 700;">Olá, <span id="b_usuario">usuário</span>!</h6>
        </div>

        <button id="btn-ativo" class="button-menu" onclick="mostrar_visao_geral()">Visão Geral</button>

        <button class="button-menu" onclick="mostrar_sensor()">Sensores</button>

        <button class="button-menu ativo" onclick="mostrar_perfil()">Perfil</button>

        <button class="btn-login" onclick="sair()"> Sair </button>
    </div>

    <div class="container-main">
        <!-- Div da página de perfil -->
        <div id="div_perfil">
            <div class="container div_texto">
                <h1>Perfil</h1>
                <p>Confira os seus dados cadastrados!</p>
            </div>

            <div class="container card-cliente">
                <!-- TOPO COM FOTO -->
                <div class="card-header">
                    <div class="foto-perfil">
                        <img src="../assets/imagens/icone_perfil.png"> alt="Foto do cliente">
                    </div>
                </div>

                <!-- DADOS -->
                <div class="campo">
                    <label>Nome Completo</label>
                    <input id="input_nome" type="text" readonly>
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input id="input_email" type="email" readonly>
                </div>

                <div class="campo">
                    <label>CPF</label>
                    <input id="input_cpf" type="text" readonly>
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input id="input_telefone" type="text" readonly>
                </div>

                <div class="campo">
                    <label>Empresa</label>
                    <input id="input_empresa" type="text" readonly>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    var b_usuario = sessionStorage.NOME_USUARIO;

    function formatarCpf(cpf) {
        return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
    }

    function formatarTelefone(telefone) {
        return telefone.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
    }

    function buscarPerfil() {

        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/usuarios/perfil/${idUsuario}`)
            .then(resposta => resposta.json())
            .then(dados => {

                input_nome.value = dados[0].nome;
                input_email.value = dados[0].email;
                input_cpf.value = formatarCpf(dados[0].cpf);
                input_telefone.value = formatarTelefone(dados[0].telefone);
                input_empresa.value = dados[0].nomeFantasia;

            });

    }

    window.onload = () => {
        buscarPerfil();
        document.getElementById("b_usuario").innerHTML = b_usuario;
    }

    // EXIBIR PÁGINA PRINCIPAL
    function mostrar_visao_geral() {
        window.location.href = './dashboard.html';
    }

    // SAIR PARA A HOME
    function sair() {
        window.location.href = '../index.html';
    }

    // EXIBIR PÁGINA DE SENSORES
    function mostrar_sensor() {
        window.location.href = './sensores.html';
    }

    // EXIBIR PÁGINA DE PERFIL
    function mostrar_perfil() {
        window.location.href = './perfil.html';
    }
</script>
