<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo/Simbolo_SafeControl.png" type="image/x-icon">
    <title>SafeControl | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <!-- Menu fixo de navegação -->

    <div class="menu-lateral">

        <a href="./dashboard.html">
            <img class="img-logo" src="../assets/logo/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">
        </a>

        <div class="perfil">
            <h6 style="color: #13131a; font-weight: 700;">Olá, <span id="b_usuario">usuário</span>!</h6>
        </div>

        <button id="btn-ativo" class="button-menu" onclick="mostrar_visao_geral()">Visão Geral</button>

        <button class="button-menu ativo" onclick="mostrar_sensor()">Sensores</button>

        <button class="button-menu" onclick="mostrar_perfil()">Perfil</button>

        <button class="btn-login" onclick="sair()"> Sair </button>
    </div>

    <div class="container-main">
        <!-- Div da página dos sensores -->
        <div id="div_sensores">
            <div class="container div_texto">
                <h1>Sensores</h1>
                <p>Confira com detalhes os seus sensores!</p>
            </div>
            <!-- DIV das KPIS -->
            <div class="container div_body" id="div_cards_sensores">
            </div>
            <!-- Barra de navegação entre tabelas -->
            <div class="container">
                <div class="agrupar" id="sensor_1">
                    <button class="button_dash" id="sensor_temp2" onclick="ocultar_umid2()"><b>Gráfico
                            Temperatura</b></button>
                    <button class="button_dash" id="sensor_umid2" onclick="ocultar_temp2()"><b>Gráfico
                            Umidade</b></button>
                </div>
            </div>
            <!-- Gráfico Temperatura -->
            <div class="container" id="temperatura2">
                <div class="grafico">
                    <canvas id="meuGrafico3"></canvas>
                </div>

            </div>
            <!-- Gráfico Umidade -->
            <div class="container div_chart" id="umidade2">
                <div class="grafico_linha">
                    <canvas id="meuGrafico4"></canvas>
                </div>

            </div>
        </div>
    </div>
</body>

</html>

<script>

    let sensorSelecionado = 1;


    function buscarSensores() {

        const div_cards_sensores = document.getElementById("div_cards_sensores");

        console.log("ENTROU NA FUNÇÃO");

        fetch("/medidas/sensores")
            .then(resposta => resposta.json())
            .then(dados => {

                div_cards_sensores.innerHTML = "";

                dados.forEach(sensor => {

                    div_cards_sensores.innerHTML += `
                    <div class="kpi-card card-sensor ${sensor.statusSensor != 'Operante' ? 'card-sensor-negativo' : ''}">
                        <div class="kpi-info">
                            <span class="kpi-title">
                                Escolha o sensor
                            </span>
                            <h2 class="kpi-value">
                                Sensor ${sensor.idSensor}
                            </h2>
                            <span class="kpi-change ${sensor.statusSensor == 'Operante' ? 'positivo' : 'negativo'}">
                                Sensor ${sensor.statusSensor.toLowerCase()}
                            </span>
                        </div>
                    </div>
                    `;

                });
            });

    }

    function trocarSensor(idSensor) {

        sensorSelecionado = idSensor;

        buscarTemperatura();
        buscarUmidade();

    }

    var b_usuario = sessionStorage.NOME_USUARIO;
    document.getElementById("b_usuario").innerHTML = b_usuario;

    // CHAMADAS DOS ELEMENTOS PRESENTES NO CORPO DO HTML
    const temperatura2 = document.getElementById("temperatura2");
    const umidade2 = document.getElementById("umidade2");

    // EXIBIR PÁGINA PRINCIPAL
    function mostrar_visao_geral() {
        window.location.href = './dashboard.html';
    }

    // EXIBIR PÁGINA DE SENSORES
    function mostrar_sensor() {
        window.location.href = './sensores.html';
    }

    // EXIBIR PÁGINA DE PERFIL
    function mostrar_perfil() {
        window.location.href = './perfil.html';
    }

    // SAIR PARA A HOME
    function sair() {
        window.location.href = '../index.html';
    }

    // ALTERNAR ENTRE OS GRÁFICOS
    function ocultar_umid2() {
        temperatura2.style.display = "flex";
        umidade2.style.display = "none";

        sensor_temp2.classList.add("ativo");
        sensor_umid2.classList.remove("ativo");
    }

    function ocultar_temp2() {
        temperatura2.style.display = "none";
        umidade2.style.display = "flex";

        sensor_umid2.classList.add("ativo");
        sensor_temp2.classList.remove("ativo");
    }

    // VARIÁVEIS QUE PUXAM O ID DO HTML PARA SEREM REFERENCIADOS NO JS
    const ctx3 = document.getElementById('meuGrafico3');
    const ctx4 = document.getElementById('meuGrafico4');

    // GRAFICO 3 - TEMPERATURA
    const grafico3 = new Chart(ctx3, {
        type: 'line',
        data: {
            labels: ['05/05: 12:00', '05/05: 13:00', '05/05: 14:00', '05/05: 15:00', '05/05: 16:00', '05/05: 17:00', '05/05: 18:00', '05/05: 19:00', '05/05: 20:00', '05/05: 21:00'],
            datasets: [{
                label: '  Temperatura Atual',
                data: [],
                borderColor: '#4facfe',
                backgroundColor: 'rgba(79, 172, 254, 0.15)',
                borderWidth: 3,
                pointBackgroundColor: '#4facfe',
                pointBorderWidth: 4,
                pointBorderColor: '#4facfe'
            },
            {
                label: 'Máxima',
                data: ['4', '4', '4', '4', '4', '4', '4', '4', '4', '4'],
                borderColor: 'red',
                borderWidth: 2,
                pointRadius: 0
            },
            {
                label: 'Mínima',
                data: ['-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4'],
                borderColor: 'blue',
                borderWidth: 2,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: -8,
                    max: 8
                }
            },
            animation: {
                duration: 500,
                easing: 'easeInOutCubic'
            }
        }
    });


    // GRAFICO 4 - UMIDADE
    const grafico4 = new Chart(ctx4, {
        type: 'bar',
        data: {
            labels: ['05/05: 12:00', '05/05: 13:00', '05/05: 14:00', '05/05: 15:00', '05/05: 16:00', '05/05: 17:00', '05/05: 18:00', '05/05: 19:00', '05/05: 20:00', '05/05: 21:00'],
            datasets: [
                {
                    label: 'Máxima',
                    data: ['85', '85', '85', '85', '85', '85', '85', '85', '85', '85'],
                    backgroundColor: '#535353'
                },
                {
                    label: 'Umidade Atual',
                    data: [],
                    backgroundColor: 'rgba(79, 172, 254)',
                },
                {
                    label: 'Mínima',
                    data: ['70', '70', '70', '70', '70', '70', '70', '70', '70', '70'],
                    backgroundColor: '#888'
                }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: 50,
                    max: 100
                }
            },
            animation: {
                duration: 500,
                easing: 'easeInOutCubic'
            }
        }
    });


    function buscarTemperatura() {
        fetch("/medidas/temperatura/1")
            .then(resposta => resposta.json())
            .then(dados => {

                dados.reverse();

                grafico3.data.labels = [];
                grafico3.data.datasets[0].data = [];
                grafico3.data.datasets[0].pointBackgroundColor = [];
                grafico3.data.datasets[0].pointBorderColor = [];

                dados.forEach(registro => {

                    let horario = new Date(registro.dtCaptura)
                        .toLocaleString('pt-BR', {
                            day: '2-digit',
                            month: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        })
                        .replace(',', ' -');

                    let temperatura = Number(registro.temperatura);

                    grafico3.data.labels.push(horario);

                    grafico3.data.datasets[0].data.push(temperatura);

                    if (temperatura > 4 || temperatura < -4) {

                        grafico3.data.datasets[0].pointBackgroundColor.push("#ff4d4f");
                        grafico3.data.datasets[0].pointBorderColor.push("#ff4d4f");

                    } else {

                        grafico3.data.datasets[0].pointBackgroundColor.push("#4facfe");
                        grafico3.data.datasets[0].pointBorderColor.push("#4facfe");

                    }

                });

                // Linhas de referência
                grafico3.data.datasets[1].data = Array(dados.length).fill(4);
                grafico3.data.datasets[2].data = Array(dados.length).fill(-4);


                grafico3.update();
            })
            .catch(erro => {
                console.error("Erro ao buscar temperatura:", erro);
            });
    }

    function buscarUmidade() {
        fetch("/medidas/umidade/1")
            .then(resposta => resposta.json())
            .then(dados => {

                dados.reverse();

                grafico4.data.labels = [];
                grafico4.data.datasets[1].data = [];
                grafico4.data.datasets[1].backgroundColor = [];

                dados.forEach(registro => {

                    let horario = new Date(registro.dtCaptura)
                        .toLocaleString('pt-BR', {
                            day: '2-digit',
                            month: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        })
                        .replace(',', ' -');

                    let umidade = Number(registro.umidade);

                    grafico4.data.labels.push(horario);

                    grafico4.data.datasets[1].data.push(umidade);

                    if (umidade > 85 || umidade < 70) {

                        grafico4.data.datasets[1].backgroundColor.push("#ff4d4f");

                    } else {

                        grafico4.data.datasets[1].backgroundColor.push("#4facfe");

                    }

                });

                // Barras de referência
                grafico4.data.datasets[0].data = Array(dados.length).fill(85);
                grafico4.data.datasets[2].data = Array(dados.length).fill(70);

                grafico4.update();
            })
            .catch(erro => {
                console.error("Erro ao buscar umidade:", erro);
            });
    }


    window.onload = () => {

        buscarSensores();
        buscarTemperatura();
        buscarUmidade();
        ocultar_umid2();

        setInterval(() => {
            buscarSensores();
            buscarTemperatura();
            buscarUmidade();
        }, 5000);

    }


</script>
