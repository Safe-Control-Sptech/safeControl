<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo/Simbolo_SafeControl.png" type="image/x-icon">
    <title>SafeControl | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <!-- Menu fixo de navegação -->

    <div class="menu-lateral">

        <a href="./dashboard.html">
            <img class="img-logo" src="../assets/logo/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">
        </a>

        <div class="perfil">
            <h6 style="color: #13131a; font-weight: 700;">Olá, <span id="b_usuario">usuário</span>!</h6>
        </div>

        <button id="btn-ativo" class="button-menu ativo" onclick="mostrar_visao_geral()">Visão Geral</button>

        <button class="button-menu" onclick="mostrar_sensor()">Sensores</button>

        <button class="button-menu" onclick="mostrar_perfil()">Perfil</button>

        <button class="btn-login" onclick="sair()"> Sair </button>
    </div>

    <div class="container-main">
        <!-- Div da visão geral -->
        <div id="div_visao_geral">
            <div class="container div_texto">
                <h1>Visão Geral</h1>
                <p>Bem-vindo ao painel de gerenciamento.</p>
            </div>

            <!-- Div das KPIS -->
            <div class="container div_body">
                <!-- KPI Alertas -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <span class="kpi-title">Alertas Críticos</span>
                        <h2 class="kpi-value" id="kpi-alertas">0</h2>
                        <span class="kpi-change" id="kpi-change-alertas">Nenhum Sensor</span>
                    </div>
                </div>
                <!-- KPI Temp -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <span class="kpi-title">Maior Leitura de Temperatura</span>
                        <h2 class="kpi-value" id="kpi-max">-- °C</h2>
                        <span class="kpi-change" id="kpi-change">00/00</span>
                    </div>
                </div>
                <!-- KPI Umi -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <span class="kpi-title">Maior Leitura de Umidade</span>
                        <h2 class="kpi-value" id="kpi-max-umi">--%</h2>
                        <span class="kpi-change" id="kpi-change-umi">00/00</span>
                    </div>
                </div>
                <!-- KPI Sensores -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <span class="kpi-title">Sensores Totais</span>
                        <h2 class="kpi-value" id="kpi-sensores">4</h2>
                        <span class="kpi-change positivo" id="kpi-sensores-ativos">2 Ativos</span>
                    </div>
                </div>
            </div>

            <!-- Barra de navegação entre tabelas -->
            <div class="container">
                <div class="agrupar">
                    <button class="button_dash ativo" id="sensor_temp" onclick="ocultar_umid()"> Sensor 1 - <b>Gráfico
                            Temperatura</b></button>
                    <button class="button_dash" id="sensor_umid" onclick="ocultar_temp()"> Sensor 1 - <b>Gráfico
                            Umidade</b></button>
                </div>

            </div>

            <!-- Gráfico Temperatura -->
            <div class="container" id="temperatura">
                <div class="grafico">
                    <canvas id="meuGrafico"></canvas>
                </div>

            </div>

            <!-- Gráfico Umidade -->
            <div class="container div_chart" id="umidade">

                <div class="grafico_linha">
                    <canvas id="meuGrafico2"></canvas>
                </div>

            </div>
        </div>
    </div>
</body>

</html>

<script>

    var b_usuario = sessionStorage.NOME_USUARIO;
    document.getElementById("b_usuario").innerHTML = b_usuario;

    // CHAMADAS DOS ELEMENTOS PRESENTES NO CORPO DO HTML E CONFIG DE VARIÁVEIS DAS KPIs
    const temperatura = document.getElementById("temperatura");
    const umidade = document.getElementById("umidade");

    const button_inicial = document.getElementById("sensor_temp");
    const button_visao_geral = document.getElementById("btn-ativo");

    const kpiSensores = document.getElementById("kpi-sensores");
    const kpiSensoresAtivos = document.getElementById("kpi-sensores-ativos");

    umidade.style.display = "none";

    button_inicial.focus();

    // EXIBIR PÁGINA PRINCIPAL
    function mostrar_visao_geral() {
        window.location.href = './dashboard.html';
    }

    // EXIBIR PÁGINA DE SENSORES
    function mostrar_sensor() {
        window.location.href = './sensores.html';
    }

    // EXIBIR PÁGINA DE PERFIL
    function mostrar_perfil() {
        window.location.href = './perfil.html';
    }

    // SAIR PARA A HOME
    function sair() {
        window.location.href = '../index.html';
    }

    function ocultar_umid() {
        temperatura.style.display = "flex";
        umidade.style.display = "none";

        sensor_temp.classList.add("ativo");
        sensor_umid.classList.remove("ativo");
    }

    function ocultar_temp() {
        temperatura.style.display = "none";
        umidade.style.display = "flex";

        sensor_umid.classList.add("ativo");
        sensor_temp.classList.remove("ativo");
    }

    // CHAMADAS DOS ELEMENTOS PRESENTES NO CORPO DO HTML E CONFIG DE VARIÁVEIS DAS KPIs
    const kpiAlertas = document.getElementById("kpi-alertas");
    const kpiMax = document.getElementById("kpi-max");
    const kpiMax2 = document.getElementById("kpi-max-umi");
    const kpiChange = document.getElementById("kpi-change");
    const kpiChange2 = document.getElementById("kpi-change-umi");
    const kpiChangeAlertas = document.getElementById("kpi-change-alertas");

    // VARIÁVEIS QUE PUXAM O ID DO HTML PARA SEREM REFERENCIADOS NO JS
    const ctx = document.getElementById('meuGrafico');
    const ctx2 = document.getElementById('meuGrafico2');

    const grafico = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Temperatura Mediana',
                    data: [],
                    borderColor: '#4facfe',
                    backgroundColor: 'rgba(79,172,254,.15)',
                    borderWidth: 3,
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    pointBackgroundColor: [],
                    pointBorderColor: []
                },
                {
                    label: 'Máxima',
                    data: Array(10).fill(4),
                    borderColor: 'red',
                    borderWidth: 2,
                    pointRadius: 0
                },
                {
                    label: 'Mínima',
                    data: Array(10).fill(-4),
                    borderColor: 'blue',
                    borderWidth: 2,
                    pointRadius: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: -8,
                    max: 8
                }
            }
        }
    });

    const grafico2 = new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Máxima',
                    data: Array(10).fill(85),
                    backgroundColor: '#535353'
                },
                {
                    label: 'Umidade Mediana',
                    data: [],
                    backgroundColor: '#4facfe'
                },
                {
                    label: 'Mínima',
                    data: Array(10).fill(70),
                    backgroundColor: '#888'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: 50,
                    max: 100
                }
            }
        }
    });

    function buscarTemperatura() {
        fetch("/medidas/temperatura/1")
            .then(resposta => resposta.json())
            .then(dados => {

                dados.reverse();

                grafico.data.labels = [];
                grafico.data.datasets[0].data = [];
                grafico.data.datasets[0].pointBackgroundColor = [];
                grafico.data.datasets[0].pointBorderColor = [];

                dados.forEach(registro => {

                    let horario = new Date(registro.dtCaptura)
                        .toLocaleString('pt-BR', {
                            day: '2-digit',
                            month: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        })
                        .replace(',', ' -');

                    let temperatura = Number(registro.temperatura);

                    grafico.data.labels.push(horario);

                    grafico.data.datasets[0].data.push(temperatura);

                    if (temperatura > 4 || temperatura < -4) {

                        grafico.data.datasets[0].pointBackgroundColor.push("#ff4d4f");
                        grafico.data.datasets[0].pointBorderColor.push("#ff4d4f");

                    } else {

                        grafico.data.datasets[0].pointBackgroundColor.push("#4facfe");
                        grafico.data.datasets[0].pointBorderColor.push("#4facfe");

                    }

                });

                // Linhas de referência
                grafico.data.datasets[1].data = Array(dados.length).fill(4);
                grafico.data.datasets[2].data = Array(dados.length).fill(-4);


                grafico.update();
            })
            .catch(erro => {
                console.error("Erro ao buscar temperatura:", erro);
            });
    }

    function buscarUmidade() {
        fetch("/medidas/umidade/1")
            .then(resposta => resposta.json())
            .then(dados => {

                dados.reverse();

                grafico2.data.labels = [];
                grafico2.data.datasets[1].data = [];
                grafico2.data.datasets[1].backgroundColor = [];

                dados.forEach(registro => {

                    let horario = new Date(registro.dtCaptura)
                        .toLocaleString('pt-BR', {
                            day: '2-digit',
                            month: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        })
                        .replace(',', ' -');

                    let umidade = Number(registro.umidade);

                    grafico2.data.labels.push(horario);

                    grafico2.data.datasets[1].data.push(umidade);

                    if (umidade > 85 || umidade < 70) {

                        grafico2.data.datasets[1].backgroundColor.push("#ff4d4f");

                    } else {

                        grafico2.data.datasets[1].backgroundColor.push("#4facfe");

                    }

                });

                // Barras de referência
                grafico2.data.datasets[0].data = Array(dados.length).fill(85);
                grafico2.data.datasets[2].data = Array(dados.length).fill(70);

                grafico2.update();
            })
            .catch(erro => {
                console.error("Erro ao buscar umidade:", erro);
            });
    }

    function buscarKpis() {

        fetch("/medidas/kpis")
            .then(resposta => resposta.json())
            .then(dados => {

                kpiMax.innerHTML =
                    Number(dados[0].maiorTemp).toFixed(1) + " °C";

                kpiMax2.innerHTML =
                    Number(dados[0].maiorUmi).toFixed(1) + " %";
            });
    }

    function buscarDataMaiorTemp() {

        fetch("/medidas/dataMaiorTemp")
            .then(resposta => resposta.json())
            .then(dados => {

                let data = new Date(dados[0].dtCaptura);

                kpiChange.innerHTML =
                    data.toLocaleString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })

            })
            .catch(erro => {
                console.error("Erro ao buscar data da maior temperatura:", erro);
            });

    }

    function buscarDataMaiorUmi() {

        fetch("/medidas/dataMaiorUmi")
            .then(resposta => resposta.json())
            .then(dados => {

                let data = new Date(dados[0].dtCaptura);

                kpiChange2.innerHTML =
                    data.toLocaleString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })

            })
            .catch(erro => {
                console.error("Erro ao buscar data da maior umidade:", erro);
            });

    }

    function buscarSensores() {

        fetch("/medidas/sensores")
            .then(resposta => resposta.json())
            .then(dados => {

                let totalSensores = dados.length;

                let sensoresAtivos = dados.filter(sensor =>
                    sensor.statusSensor == "Operante"
                ).length;

                kpiSensores.innerHTML = totalSensores;

                kpiSensoresAtivos.innerHTML = sensoresAtivos + " Ativos";

            })
            .catch(erro => {
                console.error("Erro ao buscar sensores:", erro);
            });

    }

    function buscarAlertas() {
        fetch("/medidas/alertas")
            .then(res => res.json())
            .then(dados => {

                let sensores = {};

                dados.forEach(registro => {
                    if (!sensores[registro.idSensor])
                        sensores[registro.idSensor] = [];

                    if (
                        (registro.temperatura > 4 || registro.temperatura < -4)
                        && !sensores[registro.idSensor].includes("Temperatura")
                    ) {
                        sensores[registro.idSensor].push("Temperatura");
                    }

                    if (
                        (registro.umidade > 85 || registro.umidade < 70)
                        && !sensores[registro.idSensor].includes("Umidade")
                    ) {
                        sensores[registro.idSensor].push("Umidade");
                    }
                });

                kpiAlertas.innerHTML = Object.keys(sensores).length;

                kpiChangeAlertas.innerHTML =
                    Object.entries(sensores)
                        .map(([id, tipos]) => `Sensor ${id} - ${tipos.join(" e ")}`)
                        .join(" | ") || "Nenhum Sensor";

                kpiChangeAlertas.style.color =
                    Object.keys(sensores).length ? "#ff4d4f" : "#888";

            });
    }

    window.onload = () => {
        buscarTemperatura();
        buscarUmidade();
        buscarKpis();
        buscarDataMaiorTemp();
        buscarDataMaiorUmi();
        buscarSensores();
        buscarAlertas();
    };

    setInterval(() => {
        buscarTemperatura();
        buscarUmidade();
        buscarKpis();
        buscarDataMaiorTemp();
        buscarDataMaiorUmi();
        buscarSensores();
        buscarAlertas();
    }, 5000);
</script>
