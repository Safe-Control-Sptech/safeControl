<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeControl | Login</title>

    <script src="./js/sessao.js"></script>

    <!-- CSS - Atual -->
    <link rel="stylesheet" href="css/cadastro_login.css">

    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img class="img-logo" src="./assets/logo/Logo_SafeControl_Horizontal.png" alt="Imagem da Logo da Safe Control">
        </div>
        
        <button class="voltar"><a class="link-voltar" href="./index.html">Voltar</a></button>
    </div>

    <div class="main">        
        <div class="formulario">
            <div class="form">  
                <h2>Login</h2>
                <div style="color: red;" id="msg_Erro"></div>

                <div class="form-inputs">
                    <h3>Email: </h3>
                    <input type="text" id="email_input" placeholder="email@provedor.com">
                </div>

                <div class="form-inputs">
                    <h3>Senha: </h3>
                    <input type="password" id="senha_input" placeholder="********">
                </div>

                <p>Não tem uma conta? Inscreva-se agora: <a class="link-entrar" href="./cadastro.html">Clique aqui!</a></p>
                <button class="entrar" onclick="entrar()"><a class="texto-botao">Entrar</a></button>
            </div>
        </div>
    </div>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    //sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
